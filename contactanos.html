<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ulla Design - Contáctanos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* ===== ESTILOS EXCLUSIVOS DE CONTACTO ===== */
    .contact-layout { display: grid; grid-template-columns: 1fr 1.2fr; gap: 60px; align-items: start; margin-top: 20px; }
    .contact-subtitle { font-size: 17px; line-height: 1.6; color: var(--body); margin: 0 0 40px 0; }

    .info-inner, .social-inner, .form-inner { position: relative; z-index: 2; background: var(--card); margin: 2px; padding: 40px; border-radius: calc(var(--radius-card) - 2px); height: calc(100% - 4px); }
    .info-item { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 32px; }
    .info-item:last-child { margin-bottom: 0; }
    .info-icon { width: 44px; height: 44px; background: var(--bg); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--accent); flex-shrink: 0; }
    .info-text h4 { margin: 0 0 6px 0; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 600; }
    .info-text p, .info-text a { margin: 0; font-size: 18px; font-weight: 500; color: var(--headline); transition: color 0.2s; }
    .info-text a:hover { color: var(--accent); }

    .social-highlight { margin-top: 30px; }
    .social-inner { background: linear-gradient(145deg, #2A1B1B, #1a1010); color: var(--inverse); text-align: center; padding: 40px 30px; }
    .social-inner h3 { font-family: "Playfair Display", Georgia, serif; font-size: 24px; margin: 0 0 24px 0; font-weight: 500; line-height: 1.4; }
    .social-btn { display: inline-flex; align-items: center; gap: 10px; background: transparent; border: 1px solid rgba(255,255,255,0.3); color: var(--inverse); padding: 12px 28px; border-radius: 50px; font-weight: 500; font-size: 16px; transition: all 0.3s ease; }
    .social-btn:hover { background: var(--accent); border-color: var(--accent); transform: translateY(-2px); }

    .form-inner h3 { font-family: "Playfair Display", Georgia, serif; font-size: 28px; margin: 0 0 30px 0; color: var(--headline); }
    .form-group { margin-bottom: 24px; position: relative; }
    .form-group label { display: block; font-size: 14px; font-weight: 500; color: var(--body); margin-bottom: 8px; }
    .form-control { width: 100%; padding: 16px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); font-family: Inter, sans-serif; font-size: 15px; color: var(--headline); transition: all 0.3s ease; outline: none; }
    .form-control:focus { border-color: var(--accent); background-color: var(--card); box-shadow: 0 0 0 4px rgba(198, 40, 40, 0.08); }
    select.form-control { appearance: none; -webkit-appearance: none; -moz-appearance: none; cursor: pointer; padding-right: 48px; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235F4A4A' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 16px center; background-size: 18px; }
    select.form-control:focus { background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23C62828' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); }
    select.form-control:invalid { color: var(--muted); }
    textarea.form-control { resize: vertical; min-height: 140px; }

    @media (max-width: 900px) {
      .contact-layout { grid-template-columns: 1fr; gap: 40px; }
      .info-inner, .social-inner, .form-inner { padding: 30px 20px; }
    }
  </style>
</head>

</body>
</html>
