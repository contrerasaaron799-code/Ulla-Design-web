<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ulla Design - Categorías</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* ===== ESTILOS EXCLUSIVOS DE CATEGORÍAS ===== */
    .section-head { text-align: center; margin-bottom: 40px; }
    .section-title { font-size: 38px; margin: 0 0 12px 0; }
    .section-subtitle { font-size: 16px; color: var(--body); }

    .category-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }
    .category-card {
      background: var(--card);
      border-radius: var(--radius-card);
      padding: 0;
      text-align: center;
      box-shadow: var(--shadow-card);
      border: 1px solid transparent;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      min-height: 400px;
      overflow: hidden;
    }
    .category-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-floating); }
    .card-top { padding: 16px 16px 10px 16px; display: flex; flex-direction: column; align-items: center; }
    .category-name { font-weight: 600; font-size: 20px; color: var(--headline); margin-bottom: 14px; }
    .category-btn { display: inline-block; background: var(--accent); color: #FFFFFF !important; padding: 10px 24px; border-radius: var(--radius-button); font-size: 14px; font-weight: 500; text-decoration: none; transition: opacity 0.2s; }
    .category-btn:hover { opacity: 0.9; }
    .category-image { width: 100%; flex-grow: 1; object-fit: cover; border-radius: 0 0 var(--radius-card) var(--radius-card); background-color: transparent; min-height: 120px; }

    @media (max-width: 1024px) {
      .category-grid { grid-template-columns: repeat(2, 1fr); }
      .category-card { min-height: 340px; }
      .card-top { padding: 14px 14px 8px 14px; }
    }
    @media (max-width: 768px) {
      .category-grid { grid-template-columns: repeat(2, 1fr); gap: 16px; }
      .category-card { min-height: 280px; }
      .card-top { padding: 10px 10px 6px 10px; }
      .category-name { font-size: 15px; margin-bottom: 8px; }
      .category-btn { padding: 6px 14px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <!-- Contenido igual -->
  ...
</body>
</html>
