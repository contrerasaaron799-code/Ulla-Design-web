<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ulla Design - Acerca de Nosotros</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* ===== ESTILOS EXCLUSIVOS DE NOSOTROS ===== */
    .about-header { margin-bottom: 48px; padding-top: 20px; }
    .about-subtitle { text-align: center; max-width: 650px; margin: 16px auto 0; color: var(--body); font-size: 17px; line-height: 1.6; }

    .story-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; align-items: center; margin-bottom: 60px; }
    .story-content h2 { font-family: "Playfair Display", Georgia, serif; font-size: 28px; color: var(--headline); margin-top: 0; margin-bottom: 16px; }
    .story-content p { font-size: 15px; line-height: 1.7; color: var(--body); margin-bottom: 14px; }
    .story-image-wrap { position: relative; border-radius: var(--radius-card); overflow: hidden; box-shadow: var(--shadow-floating); border: 1px solid var(--border); height: 480px; }
    .story-image-wrap img { width: 100%; height: 100%; object-fit: cover; }

    .values-section { margin: 60px 0; }
    .values-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 32px; }
    .value-inner { position: relative; z-index: 2; background: var(--card); margin: 2.5px; padding: 30px 24px; border-radius: calc(var(--radius-card) - 2.5px); height: calc(100% - 5px); text-align: center; }
    .value-icon { font-size: 32px; margin-bottom: 16px; display: inline-block; color: var(--accent); }
    .value-title { font-family: Inter, sans-serif; font-size: 18px; font-weight: 600; color: var(--headline); margin: 0 0 10px 0; }
    .value-desc { font-size: 14px; line-height: 1.6; color: var(--body); margin: 0; }

    @media (max-width: 900px) {
      .story-grid { grid-template-columns: 1fr; }
      .values-grid { grid-template-columns: 1fr; }
      .story-image-wrap { height: 280px; }
    }
  </style>
</head>
<body>
  <!-- Contenido igual -->
  ...
</body>
</html>
