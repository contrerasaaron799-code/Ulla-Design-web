<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ulla Design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* ===== ESTILOS EXCLUSIVOS DE INDEX ===== */
    .hero {
      position: relative;
      min-height: 560px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow-floating);
      background:
        linear-gradient(90deg, rgba(246,241,241,.97) 0%, rgba(246,241,241,.84) 28%, rgba(246,241,241,.20) 48%, rgba(246,241,241,.04) 100%),
        url('sofaparaelinicio.jpg') 75% center/cover no-repeat;
    }
    .hero-inner {
      width: min(50%, 500px);
      padding: 78px 64px;
    }
    h1 {
      font-size: clamp(44px, 5vw, 68px);
      line-height: 1.05;
      letter-spacing: -0.02em;
      margin-bottom: 18px;
    }
    .lead {
      font-size: 18px;
      line-height: 1.6;
      max-width: 430px;
      margin-bottom: 28px;
    }
    .hero-actions { display: flex; gap: 12px; flex-wrap: wrap; }

    .cards-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      margin-top: 36px;
      position: relative;
      z-index: 2;
    }

    .product-card {
      position: relative;
      z-index: 2;
      background: var(--card);
      margin: 2px;
      border-radius: calc(var(--radius-card) - 2px);
      overflow: hidden;
      height: calc(100% - 4px);
      display: flex;
      flex-direction: column;
      border: none;
      box-shadow: none;
    }
    .product-card img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      display: block;
    }
    .product-content {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .product-content h4 {
      font-family: Inter, sans-serif;
      font-size: 18px;
      line-height: 1.35;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .caption {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 14px;
      flex-grow: 1;
    }

    /* ===== BANNER DE RESEÑAS ===== */
    .testimonials-banner {
      position: relative;
      margin: 56px 0 28px;
      border-radius: var(--radius-card);
      overflow: hidden;
      background: linear-gradient(135deg, #3A3030 0%, #221717 100%);
      padding: 48px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 36px;
      align-items: center;
      box-shadow: var(--shadow-floating);
      z-index: 0;
    }
    .testimonials-banner > * { position: relative; z-index: 2; }
    .testimonials-info h2 { color: #FFFFFF; font-size: 34px; margin-bottom: 12px; }
    .testimonials-info p { color: rgba(255,255,255,0.82); font-size: 15px; line-height: 1.6; margin-bottom: 24px; }
    .testimonial-dots { display: flex; gap: 8px; }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: rgba(255,255,255,0.3); cursor: pointer; transition: all 0.3s ease;
    }
    .dot.active { background: var(--accent); width: 24px; border-radius: 10px; }
    .testimonial-card-wrapper { position: relative; min-height: 310px; }
    .testimonial-card {
      position: absolute; inset: 0; background: #FFFFFF; border-radius: 16px; padding: 5px 10px;
      color: var(--headline); box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      display: flex; flex-direction: column; align-items: center; text-align: center;
      opacity: 0; visibility: hidden; transition: opacity 0.5s ease, transform 0.5s ease; transform: translateY(12px);
    }
    .testimonial-card.active { opacity: 1; visibility: visible; transform: translateY(0); }
    .testimonial-name { font-family: 'Inter', sans-serif; font-size: 17px; font-weight: 600; color: var(--headline); margin: 0 0 4px 0; }
    .testimonial-stars { color: #FFB800; font-size: 16px; letter-spacing: 2px; margin-bottom: 10px; }
    .testimonial-quote { font-size: 14px; line-height: 1.5; color: var(--body); font-style: italic; margin: 0; }

    @media (max-width: 1024px) {
      .hero-inner { width: 66%; padding: 64px 40px; }
      .cards-row { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 768px) {
      .hero {
        min-height: 520px;
        background:
          linear-gradient(180deg, rgba(246,241,241,0.85) 0%, rgba(246,241,241,0.4) 30%, rgba(246,241,241,0) 100%),
          url('sofas2.jpg') center 20% / cover no-repeat !important;
        display: flex;
        flex-direction: column;
      }
      .hero-inner {
        width: 100%;
        padding: 25px 20px 20px;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: flex-start;
        flex-grow: 1;
      }
      .hero-inner .lead { margin-top: 8px; margin-bottom: 4px; }
      .hero-inner .hero-actions { margin-top: auto; margin-bottom: 25px; }
      .hero-inner .hero-actions .btn-primary { width: auto; padding: 8px 20px; }
      .cards-row { grid-template-columns: 1fr; }
      .testimonials-banner { grid-template-columns: 1fr; padding: 32px 20px; }
      .testimonial-card-wrapper { min-height: 330px; }
    }
  </style>
</head>
<body>
  <!-- (El contenido HTML se mantiene igual, solo cambia el estilo) -->
  ...
</body>
</html>
