<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ulla Design - Servicios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* ===== ESTILOS EXCLUSIVOS DE SERVICIOS ===== */
    .services-header { margin-bottom: 48px; padding-top: 20px; }
    .services-subtitle { text-align: center; max-width: 650px; margin: 16px auto 0; color: var(--body); font-size: 17px; line-height: 1.6; }

    .services-layout { display: grid; grid-template-columns: 1fr 1.2fr; gap: 40px; align-items: start; }
    .services-carousel-container { position: sticky; top: 40px; border-radius: var(--radius-card); overflow: hidden; box-shadow: var(--shadow-floating); border: 1px solid var(--border); height: 600px; }
    .carousel-track { display: flex; width: 100%; height: 100%; transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1); }
    .carousel-slide { flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; }
    .carousel-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255, 255, 255, 0.8); color: var(--headline); border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; z-index: 3; font-size: 18px; font-weight: bold; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .carousel-btn:hover { background: #ffffff; color: var(--accent); transform: translateY(-50%) scale(1.1); }
    .carousel-btn.prev { left: 20px; } .carousel-btn.next { right: 20px; }
    .carousel-dots { position: absolute; bottom: 24px; width: 100%; display: flex; justify-content: center; gap: 8px; z-index: 3; }
    .dot { width: 10px; height: 10px; background-color: rgba(255, 255, 255, 0.5); border-radius: 50%; cursor: pointer; transition: background 0.3s, transform 0.3s; }
    .dot:hover { background-color: rgba(255, 255, 255, 0.8); } .dot.active { background-color: var(--accent); transform: scale(1.3); }

    .services-list { display: flex; flex-direction: column; gap: 20px; }
    .service-inner { position: relative; z-index: 2; background: var(--card); margin: 2.5px; padding: 25.5px; border-radius: calc(var(--radius-card) - 2.5px); display: flex; gap: 24px; height: calc(100% - 5px); }
    .service-num { font-family: "Playfair Display", Georgia, serif; font-size: 32px; font-weight: 600; color: var(--accent); line-height: 1; min-width: 45px; }
    .service-text h4 { font-family: Inter, sans-serif; font-size: 20px; font-weight: 600; color: var(--headline); margin: 0 0 10px 0; }
    .service-text p { margin: 0; font-size: 15px; line-height: 1.6; color: var(--body); }

    .cta-section { margin-top: 60px; }
    .cta-inner { position: relative; z-index: 2; background: var(--card); margin: 2.5px; padding: 50px 20px; border-radius: calc(var(--radius-card) - 2.5px); text-align: center; }
    .cta-title { font-family: "Playfair Display", Georgia, serif; font-size: 32px; color: var(--headline); margin: 0 0 10px 0; }
    .cta-text { font-size: 16px; color: var(--body); margin: 0 0 28px 0; }

    @media (max-width: 900px) {
      .services-layout { grid-template-columns: 1fr; }
      .services-carousel-container { height: 350px; position: relative; top: 0; }
    }
  </style>
</head>
